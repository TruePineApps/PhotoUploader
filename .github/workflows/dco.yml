# Enforce adding Signed-off-by: Name <email> to a commit message, by which the author certifies
# under the Developer Certificate of Origin (DCO) that they have the right to submit the code under
# the project's license.
name: DCO Check

on:
  pull_request:
    branches:
      - main

jobs:
  dco:
    name: Verify Signed-off-by
    runs-on: ubuntu-latest # for platform-independent tasks
    steps:
      - name: Check DCO
        uses: christophebedard/dco-check@ec8bfc43106afe98b323ace9133650df10497e12 # 0.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # skip merge commits, revert commits, and automated bot commits (Dependabot)
          args: '--exclude-pattern "^(Merge|Revert)" --exclude-emails "dependabot[bot]@users.noreply.github.com"'