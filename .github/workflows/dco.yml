# Enforce adding Signed-off-by: Name <email> to a commit message, by which the author certifies
# under the Developer Certificate of Origin (DCO) that they have the right to submit the code under
# the project's license.
name: DCO Check

on:
  pull_request:
    branches:
      - main

jobs:
  dco:
    name: Verify Signed-off-by
    runs-on: ubuntu-latest # for platform-independent tasks
    steps:
      - name: Check DCO
        uses: christophebedard/dco-check@v0.3.0
        with:
          # skip merge commits and revert commits, which are generated by Git itself
          exclude-pattern: '^(Merge|Revert)'