name: CI

# Docs-only and release-only changes do not need a CI build.
# This workflow uses a job-level changed-files filter (the 'changes' job). This ensures the workflow
# always runs and reports status to required status checks, while skipping heavy tests/build steps
# when only docs, release.yml, or non-code files change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo. No secrets are used anywhere in this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # Detect whether changes affect desktop packaging, buildSrc, or Gradle configuration using native git diff
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      code: ${{ steps.filter.outputs.code }}
      linux_formats: ${{ steps.filter.outputs.linux_formats }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check file paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=2
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF" HEAD)
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # A new branch or force-push may not have a usable before-SHA; conservatively inspect the full tree.
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            CHANGED_FILES=$(git diff --name-only "$EMPTY_TREE" "$HEAD_SHA")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^(buildSrc/|desktopApp/|composeApp/src/desktopMain/|gradle/|gradlew(\.bat)?$|.*\.gradle(\.kts)?$|settings\.gradle(\.kts)?$|gradle\.properties$|.*\.lockfile$|\.github/actions/setup-build/action\.yml$|scripts/package-appimage\.sh$|\.github/workflows/ci\.yml)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "Desktop changes detected."
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "No desktop changes detected."
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(buildSrc/|desktopApp/build\.gradle(\.kts)?$|desktopApp/proguard-rules\.pro$|desktopApp/src/main/resources/|composeApp/build\.gradle(\.kts)?$|gradle/|gradlew(\.bat)?$|.*\.gradle(\.kts)?$|settings\.gradle(\.kts)?$|gradle\.properties$|.*\.lockfile$|\.github/actions/setup-build/action\.yml$|\.github/workflows/ci\.yml$|scripts/package-appimage\.sh$)'; then
            echo "linux_formats=true" >> "$GITHUB_OUTPUT"
            echo "Linux packaging or dependency configuration changed."
          else
            echo "linux_formats=false" >> "$GITHUB_OUTPUT"
            echo "No Linux packaging or dependency configuration changes."
          fi

          if echo "$CHANGED_FILES" | grep -vE '^(docs/|scripts/|signpath/|\.github/workflows/release\.yml|\.github/workflows/dco\.yml|\.github/dependabot\.yml|.*\.md)$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes detected."
          fi

  # Linux always runs unit tests and packages the .deb installer
  build-linux:
    name: Test & package (Linux)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - name: Run all tests
        if: needs.changes.outputs.code == 'true'
        run: ./gradlew allTests --stacktrace
      - name: Skip tests if no code changes
        if: needs.changes.outputs.code != 'true'
        run: echo "No code changes requiring tests."
      - name: Package Linux
        if: needs.changes.outputs.desktop == 'true'
        env:
          BUILD_LINUX_FORMATS: ${{ needs.changes.outputs.linux_formats }}
        run: |
          if [[ "$BUILD_LINUX_FORMATS" == "true" ]]; then
            ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --no-parallel --stacktrace
          else
            ./gradlew :desktopApp:packageReleaseDeb --no-parallel --stacktrace
          fi
      - name: Skip packaging if no desktop changes
        if: needs.changes.outputs.desktop != 'true'
        run: echo "No desktop changes requiring packaging."
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-linux
          path: "**/build/reports/tests/"
          retention-days: 7
      - name: Upload unsigned Debian package
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-linux-deb-${{ github.run_number }}
          path: desktopApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned RPM package
        if: needs.changes.outputs.linux_formats == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-linux-rpm-${{ github.run_number }}
          path: desktopApp/build/compose/binaries/main-release/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned AppImage
        if: needs.changes.outputs.linux_formats == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-linux-appimage-${{ github.run_number }}
          path: desktopApp/build/compose/binaries/main-release/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
  # Windows and macOS packages run only when config/desktop files change (or on push to main)
  build-desktop:
    name: Package (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,     os: windows-2025,   task: ":desktopApp:packageReleaseMsi", glob: "desktopApp/build/compose/binaries/main-release/msi/*.msi", arch: "x64" }
          - { name: macos-arm,   os: macos-15,       task: ":desktopApp:packageReleaseDmg", glob: "desktopApp/build/compose/binaries/main-release/dmg/*.dmg", arch: "arm64" }
          - { name: macos-intel, os: macos-15,       task: ":desktopApp:packageReleaseDmg", glob: "desktopApp/build/compose/binaries/main-release/dmg/*.dmg", arch: "x64" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          architecture: ${{ matrix.arch }}
      - name: Package Desktop
        run: ./gradlew ${{ matrix.task }} --no-parallel --stacktrace
      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-${{ matrix.name }}-${{ github.run_number }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 7
