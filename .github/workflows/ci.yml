name: CI

# Docs-only and release-only changes do not need a CI build. Only list files that can NOT affect the build:
# LICENSE, COPYRIGHT, TERMS*.md and PRIVACY*.md are copied into the app and packages,
# so they must keep triggering CI. If you make CI a *required* status check, switch to a
# job-level changed-files filter instead: skipped workflows leave required checks pending.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Architecture.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "INSTALL.md"
      - "DEVELOPMENT.md"
      - "README.md"
      - "TESTING.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/dco.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "Architecture.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "INSTALL.md"
      - "DEVELOPMENT.md"
      - "README.md"
      - "TESTING.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/dco.yml"

# Least privilege: CI only reads the repo. No secrets are used anywhere in this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # Detect whether changes affect desktop packaging, buildSrc, or Gradle configuration using native git diff
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check file paths
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=2
            CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^(buildSrc/|desktopApp/|composeApp/src/desktopMain/|.*\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradle/libs\.versions\.toml|\.github/workflows/ci\.yml)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "Desktop changes detected."
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "No desktop changes detected."
          fi

  # Linux always runs unit tests and packages the .deb installer
  build-linux:
    name: Test & package (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - name: Run all tests
        run: ./gradlew allTests --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-linux
          path: "**/build/reports/tests/"
          retention-days: 7
      - name: Package Linux
        run: ./gradlew :desktopApp:packageReleaseDeb --no-parallel --stacktrace
      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-linux
          path: desktopApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  # Windows and macOS packages run only when config/desktop files change (or on push to main)
  build-desktop:
    name: Package (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,     os: windows-2025,   task: ":desktopApp:packageReleaseMsi", glob: "desktopApp/build/compose/binaries/main-release/msi/*.msi", arch: "x64" }
          - { name: macos-arm,   os: macos-15,       task: ":desktopApp:packageReleaseDmg", glob: "desktopApp/build/compose/binaries/main-release/dmg/*.dmg", arch: "arm64" }
          - { name: macos-intel, os: macos-15,       task: ":desktopApp:packageReleaseDmg", glob: "desktopApp/build/compose/binaries/main-release/dmg/*.dmg", arch: "x64" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          architecture: ${{ matrix.arch }}
      - name: Package Desktop
        run: ./gradlew ${{ matrix.task }} --no-parallel --stacktrace
      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 7
