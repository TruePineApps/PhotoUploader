name: Release

# Runs ONLY when a version tag is pushed by hand:
#   git tag -a v1.0.3 -m "PhotoUploader 1.0.3" && git push origin v1.0.3
# Never triggered by commits. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# Never cancel a release halfway; never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_FILE_PREFIX: PhotoUploader
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  # ------------------------------------------------------------------ 1. Gate
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag against the repository
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"

          # 1. The tag must point at a commit that is on main (a tag on a stray branch must not release).
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tagged commit is not on main"; exit 1; }

          # 2. Tag major.minor.patch must match gradle/libs.versions.toml, so the tag and the app agree.
          toml() { sed -nE "s/^$1 *= *\"([^\"]*)\".*/\1/p" gradle/libs.versions.toml; }
          [[ "$(toml cfg-appMajor)" == "$MAJOR" && "$(toml cfg-appMinor)" == "$MINOR" && "$(toml cfg-appPatch)" == "$PATCH" ]] \
            || { echo "::error::Tag $TAG does not match cfg-appMajor/cfg-appMinor/cfg-appPatch in libs.versions.toml"; exit 1; }

          # jpackage on macOS rejects versions whose first number is 0.
          (( MAJOR >= 1 )) || { echo "::error::MAJOR must be >= 1 (macOS packaging)"; exit 1; }

          # 3. MSI/DMG version fields are limited to 65535 in the last component.
          (( PATCH <= 65535 )) || { echo "::error::Patch number too large for MSI"; exit 1; }

          # The tag's PATCH becomes the build number: tag v1.0.3 ships as 1.0.3 (see ProjectVersion.kt).
          STAGE="$(toml cfg-appStage)"
          {
            echo "version=$MAJOR.$MINOR.$PATCH"
            echo "build_number=$PATCH"
            echo "prerelease=$([[ -n "$STAGE" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ 2. Tests
  test:
    name: Unit tests (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with: { cache-disabled: "true" }
      - run: ./gradlew allTests --stacktrace

  # ------------------------------------------------------------------ 3. Build
  # Linux and Windows are built UNSIGNED here and signed in separate small jobs
  # (so signing credentials never share a job with the Gradle build).
  build-linux:
    name: Build Linux (.deb)
    needs: [verify, test]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with: { cache-disabled: "true" }
      - name: Write Google OAuth client config
        shell: bash
        env: { GOOGLE_CLIENT_SECRETS_JSON: "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}" }
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > composeApp/src/desktopMain/resources/client_secrets.json
          [ -s composeApp/src/desktopMain/resources/client_secrets.json ] \
            || { echo "::error::Secret GOOGLE_CLIENT_SECRETS_JSON is missing or empty"; exit 1; }
      - run: ./gradlew :desktopApp:packageReleaseDeb --no-parallel --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-linux
          path: desktopApp/build/compose/binaries/main-release/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows (.msi)
    needs: [verify, test]
    runs-on: windows-2025
    environment: release
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}   # SignPath needs this id
    env:
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with: { cache-disabled: "true" }
      - name: Write Google OAuth client config
        shell: bash
        env: { GOOGLE_CLIENT_SECRETS_JSON: "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}" }
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > composeApp/src/desktopMain/resources/client_secrets.json
          [ -s composeApp/src/desktopMain/resources/client_secrets.json ] \
            || { echo "::error::Secret GOOGLE_CLIENT_SECRETS_JSON is missing or empty"; exit 1; }
      - run: ./gradlew :desktopApp:packageReleaseMsi --no-parallel --stacktrace
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows
          path: desktopApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error
          retention-days: 3

  # macOS: Compose signs the app during packaging, so the certificate must be in this job.
  # The .dmg is then signed, notarized and stapled.
  build-macos:
    name: Build, sign and notarize macOS (.dmg)
    needs: [verify, test]
    runs-on: macos-15            # Apple silicon -> arm64 app. See docs/RELEASING.md for Intel.
    environment: release
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      KEYCHAIN: ${{ github.workspace }}/../build.keychain-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with: { cache-disabled: "true" }

      - name: Write Google OAuth client config
        env: { GOOGLE_CLIENT_SECRETS_JSON: "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}" }
        run: |
          printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > composeApp/src/desktopMain/resources/client_secrets.json
          [ -s composeApp/src/desktopMain/resources/client_secrets.json ] \
            || { echo "::error::Secret GOOGLE_CLIENT_SECRETS_JSON is missing or empty"; exit 1; }

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC_PW="$(openssl rand -base64 24)"
          echo "::add-mask::$KC_PW"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package (signed app bundle)
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}   # e.g. "Jane Doe (ABCDE12345)", WITHOUT the "Developer ID Application:" prefix
        run: |
          ./gradlew :desktopApp:packageReleaseDmg --no-parallel --stacktrace \
            -Pcompose.desktop.mac.sign=true \
            "-Pcompose.desktop.mac.signing.identity=$MACOS_SIGNING_IDENTITY" \
            "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN"

      - name: Sign the .dmg, notarize, staple
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$(ls desktopApp/build/compose/binaries/main-release/dmg/*.dmg | head -n1)"
          echo "DMG=$DMG"

          codesign --force --timestamp --sign "Developer ID Application: $MACOS_SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN" "$DMG"

          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT

          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 45m --output-format json | tee "$RUNNER_TEMP/notary.json"

          STATUS="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")"
          ID="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")"
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::Notarization status: $STATUS"
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-macos
          path: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ 4. Sign
  # Windows signing by SignPath Foundation (free for open source; the publisher shown is
  # "SignPath Foundation"). Every release needs a MANUAL approval in the SignPath web UI:
  # you get an e-mail, approve the request, and this job continues.
  #
  # Until SignPath has accepted the project (it must already have a public release first), leave
  # the repository variable WINDOWS_SIGNING unset: the MSI is then published unsigned.
  sign-windows:
    name: Sign Windows (.msi, SignPath)
    needs: build-windows
    runs-on: windows-2025
    environment: release
    timeout-minutes: 240
    steps:
      - name: Submit to SignPath and wait for your approval
        if: vars.WINDOWS_SIGNING == 'signpath'
        # Pin to a full commit SHA before the first release (see docs/RELEASING.md).
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}   # e.g. release-signing
          github-artifact-id: ${{ needs.build-windows.outputs.artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800   # 3 h to approve
          output-artifact-directory: ${{ github.workspace }}/signed

      - name: Verify the Authenticode signature
        if: vars.WINDOWS_SIGNING == 'signpath'
        shell: pwsh
        run: |
          $msi = Get-ChildItem signed -Filter *.msi -Recurse
          if ($msi.Count -ne 1) { throw "Expected exactly one signed MSI, found $($msi.Count)" }
          $sig = Get-AuthenticodeSignature $msi[0].FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Signature is not valid: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch 'SignPath Foundation') { throw "Unexpected signer: $($sig.SignerCertificate.Subject)" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $msi[0].FullName out\

      # Fallback while WINDOWS_SIGNING is not enabled: pass the unsigned MSI through.
      - name: Pass through unsigned MSI (signing not enabled)
        if: vars.WINDOWS_SIGNING != 'signpath'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: unsigned-windows, path: out }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-windows
          path: out/*.msi
          if-no-files-found: error
          retention-days: 3

  sign-linux:
    name: Sign Linux (.deb, GPG)
    needs: build-linux
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: unsigned-linux, path: out }

      - name: GPG detached signature
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in out/*.deb; do
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$GPG_KEY_FINGERPRINT" --armor --detach-sign --output "$f.asc" "$f"
            gpg --verify "$f.asc" "$f"
          done
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-linux
          path: out/*
          if-no-files-found: error
          retention-days: 3

  # ------------------------------------------------------------------ 5. Publish
  # Collects the final, signed files under stable names, writes SHA256SUMS.txt and signs it with the
  # GPG release key. Kept separate from `publish` so the GPG key and the website SSH key never share a job.
  checksums:
    name: Checksums (SHA256SUMS.txt + GPG signature)
    needs: [verify, sign-linux, sign-windows, build-macos]
    runs-on: ubuntu-24.04
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: incoming, pattern: "signed-*" }

      - name: Collect files under stable, space-free names
        run: |
          set -euo pipefail
          mkdir dist
          P="$APP_FILE_PREFIX-$VERSION"
          cp incoming/signed-linux/*.deb        "dist/$P-linux-amd64.deb"
          cp incoming/signed-linux/*.deb.asc    "dist/$P-linux-amd64.deb.asc"
          cp incoming/signed-windows/*.msi      "dist/$P-windows-x64.msi"
          cp incoming/signed-macos/*.dmg        "dist/$P-macos-arm64.dmg"

      - name: Write and sign SHA256SUMS.txt
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_FINGERPRINT: ${{ secrets.GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          # Hashes of the FINAL bytes (after SignPath, notarization and GPG), relative file names only.
          (cd dist && sha256sum -- * | sort -k2 > SHA256SUMS.txt && cat SHA256SUMS.txt)

          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$GPG_KEY_FINGERPRINT" --armor --detach-sign \
            --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          gpg --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: [verify, checksums]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: release-dist, path: dist }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.msi
            dist/*.dmg

      # Draft first: nothing is public until the website upload also succeeded.
      - name: Create draft GitHub Release and upload files
        run: |
          set -euo pipefail
          FLAGS=""; [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]] && FLAGS="--prerelease"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "$APP_FILE_PREFIX $VERSION" $FLAGS
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Upload to website (cPanel) via scp
        env:
          SSH_KEY: ${{ secrets.WEBSITE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEBSITE_KNOWN_HOSTS }}
          HOST: ${{ secrets.WEBSITE_HOST }}
          USER_NAME: ${{ secrets.WEBSITE_USER }}
          PORT: ${{ secrets.WEBSITE_PORT }}
          REMOTE_DIR: ${{ secrets.WEBSITE_DOWNLOAD_DIR }}   # e.g. /home/cpaneluser/public_html/photouploader/downloads
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "${PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)

          ssh "${SSH_OPTS[@]}" "$USER_NAME@$HOST" "mkdir -p '$REMOTE_DIR/$VERSION'"
          scp -P "${PORT:-22}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
              dist/* "$USER_NAME@$HOST:$REMOTE_DIR/$VERSION/"

          # latest.json (version + every file with its SHA-256) is uploaded LAST, so the landing page
          # only ever points at a complete release and can show the hashes without copying them by hand.
          FILES="$(awk '{print $1" "$2}' dist/SHA256SUMS.txt | jq -R -s -c 'split("\n")[:-1] | map(split(" ") | {sha256: .[0], name: .[1]})')"
          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson f "$FILES" \
            '{version:$v, released:$d, path:($v+"/"), checksums:"SHA256SUMS.txt", signature:"SHA256SUMS.txt.asc", files:$f}' > latest.json
          cat latest.json
          scp -P "${PORT:-22}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
              latest.json "$USER_NAME@$HOST:$REMOTE_DIR/latest.json"

      - name: Publish the GitHub Release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
